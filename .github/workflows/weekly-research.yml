name: Weekly Deep Research

on:
  schedule:
    # UTCで指定するため 22:30 UTC(日曜) = 日本時間 月曜7:30
    - cron: "30 22 * * 0"
  workflow_dispatch: {}

jobs:
  weekly-research:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 週次深掘りレポートを送信
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python weekly_research.py
